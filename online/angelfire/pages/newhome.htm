<script type="text/javascript">  // Pulsating Text Script  (KilerCris@Mail.com)

 // range of glowing
 var from = 6;
 var to = 12;

 //  speed of pulsing
 var delay = 60;

 //  color of glow, name or RGB value (example:'#00FF00')
 var glowColor = "lime";

 //  NO MORE EDITING!!!
 var i = to;
 var j = 0;

 function textPulseUp() {
  if (!document.all) return
  if (i < to) {
   theText.style.filter = "Glow(Color=" + glowColor + ", Strength=" + i + ")";
   i++;
   theTimeout = setTimeout('textPulseUp()',delay);
   return 0;
  }
  if (i = to) {
   theTimeout = setTimeout('textPulseDown()',delay);
   return 0;
  }
 }
 function textPulseDown() {
  if (!document.all) return
  if (i > from) {
   theText.style.filter = "Glow(Color=" + glowColor + ", Strength=" + i + ")";
   i--;
   theTimeout = setTimeout('textPulseDown()',delay);
   return 0;
  }
  if (i = from) {
   theTimeout = setTimeout('textPulseUp()',delay);
   return 0;
  }
 }
</SCRIPT>

<SCRIPT>

 function status_scroll(seed) {    // status bar scrolling captions
  var m1 = "We Moved! - " 
  var m2 = "Friends, welcome to our new home!"
  var msg = m1 + m2; 
  var out = " ";
  var c = 1;

  if (seed > 100) {
   seed--;
   var cmd = "scroll(" + seed + ")";
   timerTwo = window.setTimeout(cmd,100);
  }
  else if (seed <= 100 && seed > 0) {
   for (c=0 ; c < seed ; c++) {
    out+=" ";
   }
   out+=msg;
   seed--;
   var cmd = "scroll(" + seed + ")";
   window.status = out;
   timerTwo = window.setTimeout(cmd,100);
  }
  else if (seed <= 0) {
   if (-seed < msg.length) {
    out += msg.substring(-seed,msg.length);
    seed--;
    var cmd = "scroll(" + seed + ")";
    window.status = out;
    timerTwo = window.setTimeout(cmd,100);
   }
   else {
    window.status = " ";
    timerTwo = window.setTimeout("scroll(100)",7);
   }
  }
 }

 timerONE=window.setTimeout('scroll(100)',50);

</script>
