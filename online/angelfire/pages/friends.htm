<script type="text/javascript">  //Text Link/Image Map Tooltip 

 if (!document.layers&&!document.all) event="test"

 function showtip(current,e,text) {
  if (document.all) {
   thetitle=text.split('<br>')
   if (thetitle.length>1) {
    thetitles=''
    for (i=0;i<thetitle.length;i++) thetitles+=thetitle[i]
    current.title=thetitles
   }
   else {
    current.title=text
   }
  }
  else if (document.layers) {
   document.tooltip.document.write('<layer bgColor="white" style="border:1px solid black;font-size:12px;">'+text+'</layer>')
   document.tooltip.document.close()
   document.tooltip.left= e.PageX + 5
   document.tooltip.top= e.PageY - 10
   document.tooltip.visibility="show"
  }
 }

 function hidetip() {
  if (document.layers) document.tooltip.visibility="hidden"
 }
</script>
<div id="tooltip" style="position:absolute;visibility:hidden"></div>



<script type="text/javascript">  //Moving Eyes

 var brOK=false;
 var mie=false;
 var ex=0;
 var ey=0;
 var ae;
 var le;
 var re;
 var x0;
 var y0;
 var tid;
 var realx;
 var realy;
 var loaded=false;

 if(parseInt(navigator.appVersion.charAt(0))>=4) {brOK=true;}
 if(navigator.appName.indexOf("Microsoft")!=-1) {mie=true; }

 function myhandler(e) {
  ex=e.pageX; 
  ey=e.pageY;
  moveeye()
  return routeEvent(e);
 }

 function moveeye() {
  dy=ey-y0-20;
  dx1=ex-x0-20;
  dx2=ex-x0-60;

  r=Math.sqrt(dx1*dx1+dy*dy);
  if(r<20) r=20
  dx1=dx1*10/r+x0+10;
  dy1=dy*10/r+y0+10;

  r=Math.sqrt(dx2*dx2+dy*dy);
  if(r<20) r=20
  dx2=dx2*10/r+x0+50;

  ae.left=x0;  
  ae.top=y0;  
  le.left=dx1;  
  le.top=dy1;  
  re.left=dx2;  
  re.top=dy1;  
 }

 function setHandlers() {
  if(!mie) { y0=document.eyeballs.top;
             x0=document.eyeballs.left;
             ae=document.eyeballs;
             le=document.lefteye;   
             re=document.righteye;   
             window.captureEvents(Event.MOUSEMOVE);
             window.onMouseMove=myhandler;
           }
  else     { y0=document.all.eyeballs.style.pixelTop;
             x0=document.all.eyeballs.style.pixelLeft;
             ae=document.all.eyeballs.style;
             le=document.all.lefteye.style;
             re=document.all.righteye.style;
            }
  realx=x0+0.1;
  realy=y0+0.1;
 
  moveall();
  loaded=true;
 }

 function moveall() {
  rx=realx+34
  ry=realy+36;
  rx+=(ex-rx)*0.1;
  ry+=(ey-ry)*0.1;
  realx=rx-40;
  realy=ry-40;
  x0=Math.round(realx);
  y0=Math.round(realy);
  moveeye();
  tid=setTimeout('moveall()',100);
 }

 function placeeyes(x,y) {
  if(brOK) {
   ex=x+40;
   ey=y+40;
   s ='<DIV ID="dummy"    STYLE="position:absolute; top:'+y+'; left:'+x+'; width:10; height:10;">&#160;</DIV>';
   s+='<DIV ID="eyeballs" STYLE="position:absolute; top:'+y+'; left:'+x+'; width:80; height:40;"  ><IMG SRC="../media/eyeballs.gif" border=0></DIV>';
   s+='<DIV ID="lefteye"  STYLE="position:absolute; top:'+(y+10)+'; left:'+(x+10)+'; width:20; height:20;" ><IMG SRC="../media/eye.gif" border=0></DIV>';
   s+='<DIV ID="righteye" STYLE="position:absolute; top:'+(y+10)+'; left:'+(x+50)+'; width:20; height:20;" ><IMG SRC="../media/eye.gif" border=0></DIV>';
   document.writeln(s);
  }
 }
</script>
<script FOR=document Event="onmousemove()">
 if((mie==true)&&(brOK)&&loaded) {
  ex=document.body.scrollLeft+event.x;
  ey=document.body.scrollTop+event.y;
  moveeye();
 }
</script>
<script>
 if (document.all||document.layers)
  placeeyes(100,100);
</script>
