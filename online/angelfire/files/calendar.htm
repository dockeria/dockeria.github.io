 function nextMonth() {  // go the next month
  nCurrentMonth++;
  if (nCurrentMonth > 12) {
  nCurrentMonth -= 12;
  nextYear();
  }
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function prevMonth() {  // go the previous month
  nCurrentMonth--;
  if (nCurrentMonth < 1) {
  nCurrentMonth += 12;
  prevYear();
  }
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function prevYear() {  // go the previous year
  nCurrentYear--;
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function nextYear() {  // go the next year
  nCurrentYear++;
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function setCurrentMonth() {
  date = new Date();
  currentyear=date.getYear()
  if (currentyear < 1000) currentyear += 1900
  setYearMonth(currentyear, date.getMonth()+1);
 }

 function setMonth(nMonth) {
  setYearMonth(nCurrentYear, nMonth);

 function showYearName(current,e,nYear) {  // show tip for the Name of the Chinese Year

  if (nYear < 0) { 
   while (nYear < -12) nYear = nYear + 12;
   if (nYear < -9) nYear = nYear + 21;
   else nYear = nYear + 9;
  }
  else if (nYear < 4) nYear = nYear + 8;
  else { 
   nYear = nYear - 4;
   while (nYear > 11) nYear = nYear - 12;
  }

  text = "Chinese Year of " + YearNames[nYear]

  if (document.all) {
   thetitle=text.split('<br>')
   if (thetitle.length>1) {
    thetitles=''
    for (i=0;i<thetitle.length;i++) thetitles+=thetitle[i]
    current.title=thetitles
   }
   else
    current.title=text
  }
  else if (document.layers) {
   document.tooltip.document.write('<layer bgColor="white" style="border:1px solid black;font-size:12px;">'+text+'</layer>')
   document.tooltip.document.close()
   document.tooltip.left=e.pageX+5
   document.tooltip.top=e.pageY-5
   document.tooltip.visibility="show"
  }
 }

function clock() {
  time = new Date ();
  secs = time.getSeconds();
  sec = -1.57 + Math.PI * secs/30;
  mins = time.getMinutes();
  min = -1.57 + Math.PI * mins/30;
  hr = time.getHours();
  hrs = -1.57 + Math.PI * hr/6 + Math.PI*parseInt(time.getMinutes())/360;
  if (ns) {
    Ypos=window.pageYOffset+window.innerHeight-60;
    Xpos=window.pageXOffset+window.innerWidth-80;
  }
  else {
    Ypos=document.body.scrollTop+window.document.body.clientHeight-60;
  Xpos=document.body.scrollLeft+window.document.body.clientWidth-60;
  }
  if (ns) {
    for (i=0; i < dots; ++i) {
    document.layers["nsDigits"+i].top=Ypos-5+40*Math.sin(-0.49+dots+i/1.9);
    document.layers["nsDigits"+i].left=Xpos-15+40*Math.cos(-0.49+dots+i/1.9);
    }
    for (i=0; i < S.length; i++) {
    document.layers["nx"+i].top=Ypos+i*Ybase*Math.sin(sec);
    document.layers["nx"+i].left=Xpos+i*Xbase*Math.cos(sec);
    }
    for (i=0; i < M.length; i++) {
    document.layers["ny"+i].top=Ypos+i*Ybase*Math.sin(min);
    document.layers["ny"+i].left=Xpos+i*Xbase*Math.cos(min);
    }
    for (i=0; i < H.length; i++) {
    document.layers["nz"+i].top=Ypos+i*Ybase*Math.sin(hrs);
    document.layers["nz"+i].left=Xpos+i*Xbase*Math.cos(hrs);
    }
  }
  else {

    ieDigits[i].style.pixelTop=Ypos-15+40*Math.sin(-0.49+dots+i/1.9);
    ieDigits[i].style.pixelLeft=Xpos-14+40*Math.cos(-0.49+dots+i/1.9);
    }
    for (i=0; i < S.length; i++){
    x[i].style.pixelTop =Ypos+i*Ybase*Math.sin(sec);
    x[i].style.pixelLeft=Xpos+i*Xbase*Math.cos(sec);

    for (i=0; i < M.length; i++){

    z[i].style.pixelLeft=Xpos+i*Xbase*Math.cos(hrs);
    }
  }
  setTimeout('clock()',50);
}
