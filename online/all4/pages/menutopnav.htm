<style>
/* Glowing Text Style */
 #glowtext {
  filter:glow(color=FFFF00, strength=3);
  width:100%;
 }
 a:hover { color:FF4500; }
</style>

<script type="text/javascript">  // Glowing Text Script-

 function glowit(which) {
  if (document.all.glowtext[which].filters[0].strength==3)
   document.all.glowtext[which].filters[0].strength=2
  else
   document.all.glowtext[which].filters[0].strength=3
 }

 function glowit2(which) {
  if (document.all.glowtext.filters[0].strength==3)
   document.all.glowtext.filters[0].strength=2
  else
  document.all.glowtext.filters[0].strength=3
 }

 function startglowing() {
  if (document.all.glowtext&&glowtext.length) {
   for (i=0;i<glowtext.length;i++)
    eval('setInterval("glowit('+i+')",150)')
  }
  else if (glowtext)
   setInterval("glowit2(0)",150)
 }

</script>

<SCRIPT LANGUAGE="JavaScript">

 function freewin(htmlfile,width,height) {

  var handout_int = 10000;
  var height_offset = 26;
  var width_offset = 4;

  if (width==0 || height==0) {
   poplink = window.open(htmlfile, "winlink", "fullscreen=0, scrollbars=1, toolbar=1, menubar=0, location=0, directories=0, channelmode=0, resizable=1, status=1");
   poplink.focus();
  }
  else {
   handout = window.open(htmlfile, "winhand", "top=10, left=10, width="+width+", height="+height+", fullscreen=0, scrollbars=0, toolbar=0, menubar=0, location=0, directories=0, channelmode=0, resizable=0, status=0");
   if (!document.all) {
    height_offset = handout.outerHeight - handout.innerHeight;
    width_offset = handout.outerWidth - handout.innerWidth;
   }
   handout.resizeTo(width+width_offset,height+height_offset);
   handout.focus();
  }
 }

</SCRIPT>
