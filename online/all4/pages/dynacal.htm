 function nextMonth() {  // go the next month
  nCurrentMonth++;
  if (nCurrentMonth > 12) {
  nCurrentMonth -= 12;
  nextYear();
  }
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function prevMonth() {  // go the previous month
  nCurrentMonth--;
  if (nCurrentMonth < 1) {
  nCurrentMonth += 12;
  prevYear();
  }
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function prevYear() {  // go the previous year
  nCurrentYear--;
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function nextYear() {  // go the next year
  nCurrentYear++;
  setYearMonth(nCurrentYear, nCurrentMonth);
 }

 function setCurrentMonth() {
  date = new Date();
  currentyear=date.getYear()
  if (currentyear < 1000) currentyear += 1900
  setYearMonth(currentyear, date.getMonth()+1);
 }

 function setMonth(nMonth) {
  setYearMonth(nCurrentYear, nMonth);

 function showYearName(current,e,nYear) {  // show tip for the Name of the Chinese Year

  if (nYear < 0) { 
   while (nYear < -12) nYear = nYear + 12;
   if (nYear < -9) nYear = nYear + 21;
   else nYear = nYear + 9;
  }
  else if (nYear < 4) nYear = nYear + 8;
  else { 
   nYear = nYear - 4;
   while (nYear > 11) nYear = nYear - 12;
  }

  text = "Chinese Year of " + YearNames[nYear]

  if (document.all) {
   thetitle=text.split('<br>')
   if (thetitle.length>1) {
    thetitles=''
    for (i=0;i<thetitle.length;i++) thetitles+=thetitle[i]
    current.title=thetitles
   }
   else
    current.title=text
  }
  else if (document.layers) {
   document.tooltip.document.write('<layer bgColor="white" style="border:1px solid black;font-size:12px;">'+text+'</layer>')
   document.tooltip.document.close()
   document.tooltip.left=e.pageX+5
   document.tooltip.top=e.pageY-5
   document.tooltip.visibility="show"
  }
 }

<script language="JavaScript">    // Upper Left Corner Live Clock Script- 

 function clocktime() {

  if (!document.layers&&!document.all) return

  var Digital=new Date()
  var hours=Digital.getHours()
  var minutes=Digital.getMinutes()
  var seconds=Digital.getSeconds()
  var dn="AM" 

  if (hours>12) {
   dn="PM"
   hours=hours-12
  }
  if (hours==0)
   hours=12
   if (minutes<=9)
    minutes="0"+minutes
   if (seconds<=9)
    seconds="0"+seconds

  //change font size here to your desire
  myclock="<font size='1' face='Arial' >Current Time:<b> "+hours+":"+minutes+":"+seconds+" "+dn+"</b></font>"

  if (document.layers) {
   document.layers.liveclock.document.write(myclock)
   document.layers.liveclock.document.close()
  } 
  else if (document.all)
   liveclock.innerHTML=myclock

  setTimeout("clocktime()",1000)
 }

 clocktime()
