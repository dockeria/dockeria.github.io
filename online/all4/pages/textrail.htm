<html>
<head><title>Text Trailer</title>

<style>

<!--  Cursor trailer style  -->
.spanstyle {  
  position:absolute;
  visibility:visible;
  top:-50px;
  font-size:10pt;
  font-family:Verdana;
  font-weight:bold;
  color:darkcyan;
 }

<!--  Glowing text style  -->
 #glowtext {
  filter:glow(color=FFFF00, strength=3);
  width:100%;
 }

</style>


<script>  // cursor trailer text

  var x,y;
  var step=12;
  var flag=0;

  // Your snappy message. Important: the space at the end of the sentence!!!

  var message="D Y N A M I C  D R I V E ! ";

  message=message.split("");

  var xpos=new Array();
  for (i=0;i<=message.length-1;i++) {
   xpos[i]=-50
  }

  var ypos=new Array();
  for (i=0;i<=message.length-1;i++) {
   ypos[i]=-50
  }

  function handlerMM(e) {
   x = ((document.layers) ? e.pageX : document.body.scrollLeft+event.clientX)  
   y = ((document.layers) ? e.pageY : document.body.scrollTop+event.clientY) - 15
   flag=1
  }

  function makesnake() {
   if (flag==1 && document.all) {
    for (i=message.length-1; i>=1; i--) {
       xpos[i]=xpos[i-1]+step
    ypos[i]=ypos[i-1]
    }
    xpos[0]=x+step
    ypos[0]=y
    for (i=0; i<message.length-1; i++) {
        var thisspan = eval("span"+(i)+".style")
        thisspan.posLeft=xpos[i]
    thisspan.posTop=ypos[i]
        }
   }
   else if (flag==1 && document.layers) {
    for (i=message.length-1; i>=1; i--) {
       xpos[i]=xpos[i-1]+step
    ypos[i]=ypos[i-1]
        }
    xpos[0]=x+step
    ypos[0]=y
    for (i=0; i<message.length-1; i++) {
        var thisspan = eval("document.span"+i)
        thisspan.left=xpos[i]
    thisspan.top=ypos[i]
        }
   }
   var timer=setTimeout("makesnake()",30)
  }

</script>

</head>

<body bgcolor=#F0F0F0 background="../media/bgpenny.jpg" onLoad="makesnake()" style="width:100%;overflow-x:hidden;overflow-y:scroll" topmargin=0 leftmargin=0>


<script>  // Beginning of Cursor Trailer Text

  for (i=0;i<=message.length-1;i++) {
    document.write("<span id='span"+i+"' class='spanstyle'>")
    document.write(message[i])
    document.write("</span>")
  }

  if (document.layers) {
    document.captureEvents(Event.MOUSEMOVE);
  }
  document.onmousemove = handlerMM;

</script>


<center><span id="glowtext"><img src="../media/e_red.gif" align="middle"></span>



</body>
</html>
