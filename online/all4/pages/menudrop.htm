<html>
<head><title>Menu Dropdown</title>

<style>
/* Dropdown menu style */
 .iewrap1 {
  position:relative;
  height:30px;
 }
 .iewrap2 {
  position:absolute;
}

 #dropmenu0, #dropmenu1 {  <!-- here more dropmenu...  -->
  visibility:hide;
  z-index:100;
 }
</style>


<SCRIPT LANGUAGE="JavaScript">    // Freewindows open
 function freewin(htmlfile) {
  window.open(htmlfile, "freewin", "top=100, left=100, width=100, height=100, fullscreen=0, scrollbars=0, toolbar=0, menubar=0, location=0, directories=0, channelmode=0, resizable=0, status=0");
 }
</SCRIPT>

<script>    // Fullwindows open
 function fullwin(htmlfile) {
  window.open(htmlfile,"fullwin","fullscreen,scrollbars")
 }
</script>


<script type="text/javascript">  // Drop down menu link

 // Contents for menu 1
    var menu1=new Array()
  menu1[0]="</center><font face='Verdana, Arial, Times New Roman, Arial Narrow' size=2><a href='../pages/caculator'>Caculator</a><br>"
  menu1[1]="<a href='../pics/jonbenet.jpg'>Jonbenet Ramsey</a><br>"
  menu1[2]="<a href=javascript:freewin('../pages/winAniOpen')>All Have Blessed</a><br>"
  menu1[3]="<a href='../media/sin.gif'>All Have Sined...</a><br>"
  menu1[4]="Learning <img src='../media/more.gif' align="bottom">"

 // Contents for menu 2
    var menu2=new Array()
  menu2[0]="<center><font face='Verdana, Arial Narrow, Times New Roman' color=#FF0000 size=2><b>"
  menu2[1]="This will bring to shutdown your computer!"
  menu2[2]="<br></b></font></center>"

 // more ...

</script>

</head>

<body background="../media/bgbricks.gif" leftmargin=0 topmargin=0>



<script type="text/javascript">  // where start the dropdown menu

 var zindex=100

 function dropit2(whichone) {
  if (window.themenu&&themenu.id!=whichone.id)
   themenu.style.visibility="hidden"
  themenu=whichone
  if (document.all) {
   themenu.style.left=document.body.scrollLeft+event.clientX-event.offsetX
   themenu.style.top=document.body.scrollTop+event.clientY-event.offsetY+18
   if (themenu.style.visibility=="hidden") {
    themenu.style.visibility="visible"
    themenu.style.zIndex=zindex++
   }
   else {
    hidemenu()
   }
  }
 }

 function dropit(e,whichone) {
  if (window.themenu&&themenu.id!=eval(whichone).id)
   themenu.visibility="hide"
  themenu=eval(whichone)
  if (themenu.visibility=="hide")
   themenu.visibility="show"
  else
   themenu.visibility="hide"
  themenu.zIndex++
  themenu.left=e.pageX-e.layerX
  themenu.top=e.pageY-e.layerY+19
  return false
 }

 function hidemenu(whichone) {
  if (window.themenu)
  themenu.style.visibility="hidden"
 }

 function hidemenu2() {
  themenu.visibility="hide"
 }

 if (document.all)
  document.body.onclick=hidemenu

</script>


<center>
<table cellpadding=0 cellspacing=0 border=0>
<tr><td width=3></td>
<td width=60>

<!--  Menu 1 starts here---------->

 <ilayer height=35px>
  <layer visibility=show>
   <span class=iewrap1>
    <span class=iewrap2 onClick="dropit2(dropmenu0);event.cancelBubble=true;return false"
      onMouseOver="dropit2(dropmenu0);event.cancelBubble=true;return false">
     <font face="Arial Narrow, Verdana" size=2><b>
     <a href="alternate.htm" onClick="if(document.layers) return dropit(event, 'document.dropmenu0')">
      Open Links
     </a></b></font>
    </span>
   </span>
  </layer>
 </ilayer>

</td>
<td width=8 align="bottom" valign="top">| </td>
<td width=90>

<!--  Menu 2 starts here---------->

 <ilayer height=35px>
  <layer visibility=show>
   <span class=iewrap1>
    <span class=iewrap2 onClick="dropit2(dropmenu1);event.cancelBubble=true;return false"
      onMouseOver="dropit2(dropmenu1);event.cancelBubble=true;return false"
      OnMouseOut="javascript:fullwin('../pages/shutdown')">
     <font face="Arial Narrow, Verdana" size=2><b>
      <a href="alternate.htm" onClick="if(document.layers) return dropit(event, 'document.dropmenu1')">
       Close Windows
      </a></b>
     </font>
    </span>
   </span>
  </layer>
 </ilayer><br>

</td><tr>
</table>






<!--  where right above end of the body tag  -->

<div id=dropmenu0 style="position:absolute;left:0;top:0;layer-background-color:lightyellow;background-color:none;width:135;visibility:hidden;border:1px solid white;padding:0px">
  <script type="text/javascript">
    if (document.all)
      dropmenu0.style.padding="4px"
    for (i=0;i<menu1.length;i++)
      document.write(menu1[i])
  </script>
</div><script type="text/javascript">
  if (document.layers) {
    document.dropmenu0.captureEvents(Event.CLICK)
    document.dropmenu0.onclick=hidemenu2
  }
</script>


<div id=dropmenu1 style="position:absolute;left:0;top:0;layer-background-color:lightyellow;background-color:none;width:95;visibility:hidden;border:1px solid bisque;padding:0px">
  <script type="text/javascript">
    if (document.all)
      dropmenu1.style.padding="4px"
    for (i=0;i<menu2.length;i++)
      document.write(menu2[i])
  </script>
</div><script type="text/javascript">
  if (document.layers) {
    document.dropmenu1.captureEvents(Event.CLICK)
    document.dropmenu1.onclick=hidemenu2
  }
</script>

</body>
</html>
