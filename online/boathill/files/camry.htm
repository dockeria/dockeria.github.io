<html>
<head><title>Camry Gallery</title>

<script type="text/javascript">  // Blending Image Slide Show Script- 

  function reapply()
  {

   return true
  }
  window.onerror=reapply

</script>

<SCRIPT LANGUAGE="JavaScript">

 function freewin(htmlfile,width,height) {

  var handout_int = 10000;
  var height_offset = 26;
  var width_offset = 4;

  if (width==0 || height==0) {
   poplink = window.open(htmlfile, "winlink", "fullscreen=0, scrollbars=1, toolbar=1, menubar=0, location=0, directories=0, channelmode=0, resizable=1, status=1");
   poplink.focus();
  }
  else {
   handout = window.open(htmlfile, "winhand", "top=10, left=10, width="+width+", height="+height+", fullscreen=0, scrollbars=0, toolbar=0, menubar=0, location=0, directories=0, channelmode=0, resizable=0, status=0");
   if (!document.all) {
    height_offset = handout.outerHeight - handout.innerHeight;
    width_offset = handout.outerWidth - handout.innerWidth;
   }
   handout.resizeTo(width+width_offset,height+height_offset);
   handout.focus();
  }
 }

</SCRIPT>

</head>

  function slideit()
  {
   if (!document.images) return
   if (document.all) slide.filters.blendTrans.apply()
   document.images.slide.src=eval("image"+step+".src")
