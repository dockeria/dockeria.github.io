 function demo_text() {
  if (j>maxfonts) {
   i = 0; j = 1;
  }
  else i++;

  if (i==(j*ratio)) {
   if (dg_ie) {  // changing the greeting style
    dg_ie.style.visibility = "hidden";
    msgs = '<FONT CLASS="text'+j+'">'+msgText+'</FONT>';
    dg_ie.innerHTML= msgs;
//    dg_ie.style.left = bodyLeft+(bodyWidth-dg_ie.clientWidth)/2;
//    dg_ie.style.top = bodyTop+(bodyHeight-dg_ie.clientHeight)/2;
    dg_ie.style.visibility = "visible";
   }
   j++; 
   if (dm_ie) {  // randomly hide the right-top image
    if (j==(Math.round(Math.random()*maxfonts))) {
     dm_ie.className = "btfilter";
     dm_ie.filters.blendTrans.Play();
    }
    else {
     dm_ie.style.visibility = "visible";
    }
   }
  }

  if (dt_ie) {  // randomly change the text color
   dt_color = Math.round(Math.random()*(maxcolors-offrgb)) + offrgb;
   dt_ie.style.color = dt_color;
  }

  if (document.all.id_music) {
   if (k<musictimeout) { // playing music fadeout before the timeout
    if (k>(musictimeout-musicfadeout)) {
     musicvolume = document.all.id_music.volume;
     document.all.id_music.volume = musicvolume-(musicvolume-minvolume)/(Math.pow(2,(musictimeout-k)));
    }
    k++;
   }
   else {    // randomly change the music
    k = Math.round(Math.random()*(max-1));
    document.all.id_music.src = music[k][0];
    musicvolume = defvolume-(offvolume*music[k][1]);
    if (musicvolume>maxvolume) musicvolume = maxvolume;
    if (musicvolume<minvolume) musicvolume = minvolume;
    if (musicoff==0) document.all.id_music.volume = musicvolume;
   }
  }
  setTimeout("demo_text()", intervals);
 }

/*************************************************
 function demo_splash()
 */
 function demo_splash() {
  if (document.all) {
   if (document.all.id_splash)
    dg_ie = document.all.id_splash;
   if (document.all.id_image)
    dm_ie = document.all.id_image;
   if (document.all.id_text) {
    dt_ie = document.all.id_text;
    dt_ie.innerHTML = tagMarquee+msgMarquee+endMarquee;
    dt_ie.style.left = bodyLeft;
    dt_ie.style.top = bodyHeight-dt_ie.offsetHeight-taskbarHeight;
   }
   demo_text();
  }
 }

/*************************************************
 function musicvoldown(offvol)
 function musictoggle(offvol)
 function musicvolup(offvol)
 */
 function musicvoldown(offvol) {
  if (document.all.id_music && document.all.id_voldown) {
   document.all.id_voldown.blur();
   if (musicoff==0 && defvolume>minvolume) {
    if (offvol>=minvolume && offvol<=maxvolume) 
     defvolume = offvol;
    else {
     offvol = offvolume*(Math.pow(100,(musicvolume-1)/minvolume));
     defvolume = musicvolume - offvol;
     if (defvolume<minvolume) defvolume=minvolume;
     offvol = 1;
    }
    musicvolume = document.all.id_music.volume;
    if (musicvolume>defvolume) musicvolume=defvolume;
    document.all.id_music.volume = musicvolume;
   }
  }
 }

 function musictoggle() {
  if (document.all.id_music && document.all.id_toggle) {
   document.all.id_toggle.blur();
   if (musicoff==0) {
    document.all.id_music.volume = minvolume;
    document.all.id_toggle.value = "Music Off";
    musicoff = 1;
   }
   else {
    document.all.id_music.volume = defvolume;
    document.all.id_toggle.value = "Music On";
    musicoff = 0;
   }
   document.all.id_sound.src = snd_click;
  }
 }

 function musicvolup(offvol) {
  if (document.all.id_music && document.all.id_volup) {
   document.all.id_volup.blur();
   if (musicoff==0 && defvolume<maxvolume) {
    if (offvol>=minvolume && offvol<=maxvolume)
     defvolume = offvol;
    else {
     offvol = offvolume*(Math.pow(80,(musicvolume-1)/minvolume));
     defvolume = musicvolume + offvol;
     if (defvolume>maxvolume) defvolume = maxvolume;
    }
    musicvolume = document.all.id_music.volume;
    if (musicvolume<defvolume) musicvolume = defvolume;
    document.all.id_music.volume = musicvolume;
   }
  }
 }

/*************************************************
 function delay(timeIntervals)
 */
 function delay(timeIntervals) { // delay intervals in milliseconds
  var timeNow, timeThen=new Date().getTime();
  timeNow = timeThen;
  while((timeNow-timeThen)<timeIntervals)
  {
   timeNow = new Date().getTime();
  }
 }

     k = musictimeout-speaktimeout;

 }
