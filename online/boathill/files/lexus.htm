<script type="text/javascript">  // Blending Image Slide Show Script- 

  function reapply()
  {
   setTimeout("slideit()",2000)
   return true
  }
  window.onerror=reapply

</script>

<SCRIPT LANGUAGE="JavaScript">    // freewin

 function freewin(htmlfile,width,height) {

  var handout_int = 10000;
  var height_offset = 26;
  var width_offset = 4;

  if (width==0 || height==0) {
   poplink = window.open(htmlfile, "winlink", "fullscreen=0, scrollbars=0, toolbar=0, menubar=0, location=0, directories=0, channelmode=0, resizable=0, status=0");
   poplink.focus();
  }
  else {
   handout = window.open(htmlfile, "winhand"+width+"", "top=10, left=10, width="+width+", height="+height+", fullscreen=0, scrollbars=0, toolbar=0, menubar=0, location=0, directories=0, channelmode=0, resizable=0, status=0");
   if (!document.all) {
    height_offset = handout.outerHeight - handout.innerHeight;
    width_offset = handout.outerWidth - handout.innerWidth;
   }
   handout.resizeTo(width+width_offset,height+height_offset);
   handout.focus();
  }
 }

</SCRIPT>

<script>  // change number_of_images below

  function slideit()
  {
   if (!document.images) return
   if (document.all) slide.filters.blendTrans.apply()
   document.images.slide.src=eval("image"+step+".src")
   if (document.all) slide.filters.blendTrans.play()
   whichimage=step
   if (step<number_of_images) step++

   if (document.all) setTimeout("slideit()",speed*1000+3000)

  }

</script>
