<html>
<head><title>Toyota Gallery</title>

<style>
 body {
  background: #FFFFFF url('../pics/toyota_logo.gif');
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: black;
  margin: 0 0 0 0;
  padding: 0 0 0 0;
 }
</style>

<script type="text/javascript">  // Blending Image Slide Show Script- 

  function reapply()
  {
   setTimeout("slideit()",2000)
   return true
  }
  window.onerror=reapply

</script>

</head>

<body onLoad="self.resizeTo(360,196)" onMouseOut="self.close()">

<table width=100% height=100% cellpadding="0" cellspacing=0 BORDER=0>
 <tr>
  <td align="CENTER" Valign="MIDDLE">

<script>  // change number_of_images below 
  var number_of_images=8
    // change speed below (in seconds)
  var speed=3
  var step=1
  var whichimage=1
  var str="";

  var image1=new Image()  ;  image1.src="../pics/toyota_camry_v6le.jpg";
  var image2=new Image()  ;  image2.src="../pics/toyota_avalon.jpg";
  var image3=new Image()  ;  image3.src="../pics/toyota_picnic.gif";
  var image4=new Image()  ;  image4.src="../pics/toyota_rav4.gif";
  var image5=new Image()  ;  image5.src="../pics/toyota_sienna.jpg";
  var image6=new Image()  ;  image6.src="../pics/toyota_sienna_blue.jpg";
  var image7=new Image()  ;  image7.src="../pics/toyota_avensis.gif";
  var image8=new Image()  ;  image8.src="../pics/toyota_mr2.gif";

  function slideit()
  {
   if (!document.images) return
   if (document.all) slide.filters.blendTrans.apply()
   document.images.slide.src=eval("image"+step+".src")
   if (document.all) slide.filters.blendTrans.play()
   whichimage=step
   if (step<number_of_images) step++
   else step=1
   if (document.all) setTimeout("slideit()",speed*1000+3000)
   else setTimeout("slideit()",speed*1000)
  }
  
  str+="<a href='http://www.crown-motors.com/'>"
  str+="<img id='reflect' src=+image1.src+ name='slide' width=350 height=175 align="center" border=0 alt='Toyota Gallery' style='filter:blendTrans(duration=3)'>"
  str+="</a><br>"

  document.writeln(str);

  slideit();

</script>

  </td>
 </tr>
</table>


</body>
</html>
