<html>
<head><title>BMW Gallery</title>

<script type="text/javascript">  // Blending Image Slide Show Script- 

  function reapply()
  {
   setTimeout("slideit()",2000)
   return true
  }
  window.onerror=reapply

</script>

</head>

<body BACKGROUND="" BGCOLOR=#000000 onLoad="self.resizeTo(680,520)">

<table width=100% height=100% cellpadding="0" cellspacing=0 BORDER=0>
 <tr>
  <td align="CENTER" valign="MIDDLE">

<script>  // change number_of_images below 
  var number_of_images=3
    // change speed below (in seconds)
  var speed=3
  var step=1
  var whichimage=1
  var str="";

  var image1=new Image()  ;  image1.src="../pics/bmw_m5coupe.jpg"
  var image2=new Image()  ;  image2.src="../pics/bmw_z3.jpg"
  var image3=new Image()  ;  image3.src="../pics/bmw_750iL.jpg"

  function slideit()
  {
   if (!document.images) return
   if (document.all) slide.filters.blendTrans.apply()
   document.images.slide.src=eval("image"+step+".src")
   if (document.all) slide.filters.blendTrans.play()
   whichimage=step
   if (step<number_of_images) step++
   else step=1
   if (document.all) setTimeout("slideit()",speed*1000+3000)
   else setTimeout("slideit()",speed*1000)
  }
  
  str+="<a href='http://www.bmw.com/'>"
  str+="<img id='reflect' src=+image1.src+ name='slide' width=426 height=312 align="center" border=0 alt='BMW Show Room' style='filter:blendTrans(duration=3)'>"
  str+="</a><br>"

  document.writeln(str);

  slideit();

</script>

  </td>
 </tr>
</table>


</body>
</html>
